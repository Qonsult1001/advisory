name: Mutation

# Remote trigger for the SAME scripts you run locally. When an issue is labelled `mutation` (or a
# tester comments on a labelled issue), or you dispatch manually, this installs the Claude Code CLI
# and runs `scripts/mutate-claude.sh` — the exact entrypoint the local timer uses. The script runs
# `claude -p "/mutate"`, which calls `scripts/mutate-ide.sh` (timer gate + build/test + PR). PR-only.
#
# Auth: CI has no interactive Claude login, so it needs ONE secret —
#   CLAUDE_CODE_OAUTH_TOKEN  (from `claude setup-token`)   ← recommended
#   or ANTHROPIC_API_KEY
# GitHub access uses the built-in GITHUB_TOKEN (no extra secret).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the MUTATE_HOURS schedule"
        type: boolean
        default: true

permissions:
  contents: write           # push the session branch (NOT main — enforced in mutate-ide.sh)
  pull-requests: write      # open the PR
  issues: write             # comment back on the ticket

jobs:
  mutate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'mutation') ||
      (github.event_name == 'issue_comment' && contains(join(github.event.issue.labels.*.name, ','), 'mutation'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git + gh auth
        run: |
          git config user.name  "Willie Olivier"
          git config user.email "189504724+Qonsult1001@users.noreply.github.com"
          # gh is preinstalled on the runner; authenticate with the workflow token.
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run the evolution scripts (same entrypoint as local)
        run: |
          chmod +x scripts/mutate-claude.sh scripts/mutate-ide.sh
          ./scripts/mutate-claude.sh
        env:
          # Claude CLI auth — provide whichever secret you set.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Mutation config consumed by scripts/mutate-ide.sh
          REPO: ${{ github.repository }}
          LABEL: mutation
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MUTATE_HOURS: '*'                          # CI is event-triggered, so act every run
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

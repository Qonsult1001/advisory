services:
  # Proxy/store — UNCHANGED. After first start, create two repos in Nexus:
  #   quarantine-pypi : proxy repo (upstream pypi) that developers CANNOT read
  #   approved-pypi   : hosted repo developers DO pull from
  # The bridge promotes quarantine -> approved on a clean gate decision.
  nexus:
    # Pinned for reproducibility (ADR 0001): every install gets the Nexus we tested against.
    # 3.93.1 Community supports a proxy recipe for every gateable ecosystem. Bump deliberately.
    image: sonatype/nexus3:3.93.1
    ports: ["8081:8081"]
    volumes: ["nexus-data:/nexus-data"]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_strong_Pass123   # change; meets complexity policy
    ports: ["1434:1433"]   # host 1433 is taken by another container; map to 1434 (in-network port stays 1433)
    volumes: ["mssql-data:/var/opt/mssql"]

  api:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["5000:5000"]
    depends_on: [nexus, mssql]
    environment:
      - PolicyPath=/data/policy.json
      - AuditPath=/data/audit.jsonl
      - WormPath=/data/audit.worm.jsonl
      - ScanIndexPath=/data/scans.json
      # The whole repo is mounted read-only at /workspace so the API can SEE and trigger the local
      # mutation worker (scripts/mutate-claude.sh) directly — no manual start-worker.cmd needed.
      - REPO_ROOT=/workspace
      # --- Durable intake queue (SQL Server; table auto-created) ---
      - SQL_CONNECTION_STRING=Server=mssql,1433;Database=master;User Id=sa;Password=Your_strong_Pass123;TrustServerCertificate=True
      - INTAKE_BATCH=10
      # --- Nexus promotion bridge (the interception piece) ---
      - NEXUS_URL=http://nexus:8081
      - NEXUS_QUARANTINE_SUFFIX=quarantine   # repos are <eco>-quarantine (discovered dynamically; ADR 0001)
      - NEXUS_APPROVED_SUFFIX=approved       # repos are <eco>-approved
      - NEXUS_AUTOPROVISION=false            # default off: operator enables ecosystems from the UI; true => auto-seed all
      - NEXUS_USER=admin
      - NEXUS_PASS=admin123          # change after first Nexus login
      - NEXUS_POLL_SECONDS=30
      - NEXUS_DELETE_ON_HOLD=false   # true => purge held packages instead of leaving them
      # --- Auto-gate-on-pull: tail Nexus's request.log to gate dev pulls of not-yet-approved packages ---
      - NEXUS_REQUEST_LOG=/nexus-data/log/request.log
      # --- Entra ID (Azure AD) auth + RBAC. Unset => dev fallback (all roles, local only) ---
      # - AzureAd__Instance=https://login.microsoftonline.com/
      # - AzureAd__TenantId=<tenant-guid>
      # - AzureAd__ClientId=<api-app-registration-client-id>
      # - AzureAd__Audience=api://<api-app-registration-client-id>
      # --- Intelligence (all optional; free path works with none) ---
      # VulnCheck community key activates the free vulncheck-kev exploited-intel index. From .env.
      - VULNCHECK_API_KEY=${VULNCHECK_API_KEY:-}
      # - SOCKET_API_KEY=
      # - ARTIFACTORY_URL=
      # - ARTIFACTORY_TOKEN=
      # --- Research agent (Groq, OpenAI-compatible). Deterministic fallback if unset. ---
      # Project-specific var name (PKGFW_*) so a machine-wide GROQ_API_KEY can't shadow it via compose.
      - GROQ_API_KEY=${PKGFW_GROQ_API_KEY:-}
      - GROQ_MODEL=${PKGFW_GROQ_MODEL:-openai/gpt-oss-120b}
      # --- OpenRouter (OpenAI-compatible). Used by an agent whose endpoint is openrouter.ai. ---
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # --- On-prem PII redaction (OpenAI Privacy Filter sidecar). Unset => Groq+regex fallback. ---
      - PRIVACY_FILTER_URL=http://privacy-filter:8071
      # --- VS Code extension code-scanner (trailofbits/vsix-audit sidecar). Real exfiltration/RAT/
      #     obfuscation/IOC detection on the actual .vsix bytes. Unset => reputational analysis only. ---
      - VSIX_SCANNER_URL=http://vsix-scanner:8099
      # --- Self-evolution (PR-only). Dashboard reads tickets + dispatches the evolve.yml workflow.
      #     gh in the container authenticates from GH_TOKEN. Off by default. ---
      - EVOLUTION_ENABLED=${EVOLUTION_ENABLED:-false}
      - EVOLUTION_REPO=${EVOLUTION_REPO:-}
      - GH_TOKEN=${PKGFW_GH_TOKEN:-}
      - EVOLUTION_QUEUE_DIR=/data/evolution-queue
      # - ITSM_WEBHOOK_URL=          # ServiceNow/Jira ticket event
    volumes:
      # ALL runtime data lives in ./data in your dev root (G:\development\Advisory\data) — visible,
      # persistent, editable. policy.json, audit ledgers, scans, and the mutation queue are all here.
      - "./data:/data"
      # The repo itself, mounted READ-ONLY, so the API can see + run scripts/mutate-claude.sh directly.
      - "./:/workspace:ro"
      # Read-only view of Nexus's data dir so the API can tail request.log (auto-gate-on-pull).
      - "nexus-data:/nexus-data:ro"

  # OpenAI Privacy Filter (openai/privacy-filter, Apache-2.0) running on-prem via transformers.js.
  # Detects + redacts PII in unstructured text; model cached in a volume after first download.
  privacy-filter:
    build: { context: ./tools/privacy-filter, dockerfile: Dockerfile }
    ports: ["8071:8071"]
    environment:
      - PF_REPO=${PF_REPO:-openai/privacy-filter}
      - PF_ONNX_VARIANT=${PF_ONNX_VARIANT:-model_fp16.onnx}
      - PF_CACHE=/cache
    volumes: ["pf-cache:/cache"]

  # VS Code extension exfiltration scanner (trailofbits/vsix-audit). Real code-level analysis of the
  # published .vsix: Discord/Telegram-webhook exfiltration, SSH-key/cookie/credential theft, eval/
  # Function/process.binding, obfuscation (entropy/zero-width/bidi), IOC/C2 + crypto wallets, YARA RAT
  # rules. The API calls it for AI Editor Extensions; honest failure (never a silent clean) on error.
  vsix-scanner:
    build: { context: ./tools/vsix-scanner, dockerfile: Dockerfile }
    ports: ["8099:8099"]

  console:
    build: { context: ., dockerfile: web/Dockerfile }
    ports: ["8088:80"]   # host 8080 is taken by a local process; serve console on 8088
    depends_on: [api]

volumes:
  nexus-data:
  pf-cache:
  mssql-data:
  # NOTE: API data is no longer a named volume — it's the ./data bind mount (visible in your dev root).

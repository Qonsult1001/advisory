# Console nginx — serves the built SPA and proxies the API to the api container so the console can be
# reached same-origin (works in dev AND behind an HTTPS reverse proxy like Nginx Proxy Manager). The
# console's API base is "/api" (see web/src/App.jsx), so calls to /api/ and /v1/ are forwarded here to
# the api service. This file is COPYd into the console image by web/Dockerfile.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Forward the admin API. "api" is the compose service name; port 5000 is the API's admin listener.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward the OpenAI-compatible /v1 surface (LLM gateway) to the same api container.
    location /v1/ {
        proxy_pass http://api:5000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every other path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
